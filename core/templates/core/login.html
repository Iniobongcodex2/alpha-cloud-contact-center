<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ALPHA Cloud Contact Center</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0A1E3D; /* Alpha Navy */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #FFFFFF;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border-top: 5px solid #C9A84C; /* Alpha Gold */
            text-align: center;
        }
        .login-card h1 {
            color: #0A1E3D;
            margin-bottom: 5px;
            font-size: 28px;
            letter-spacing: 2px;
        }
        .login-card p {
            color: #2D3748;
            font-size: 12px;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1A4B8C; /* Alpha Blue */
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-control:focus {
            outline: none;
            border-color: #1A4B8C;
            box-shadow: 0 0 5px rgba(26, 75, 140, 0.3);
        }
        .btn {
            background-color: #1A4B8C;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0A1E3D;
        }
        .error-message {
            background-color: #fed7d7;
            color: #742a2a;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .forgot-text {
            margin-top: 20px;
            font-size: 13px;
            color: #2D3748;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>ALPHA</h1>
        <p>SMART COMMUNICATION. BETTER BUSINESS.</p>

        {% if form.errors %}
            <div class="error-message">
                Your username and password didn't match. Please try again.
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="forgot-text">
            Forgot your password?<br>
            <strong>Contact your ALPHA Administrator to reset it.</strong>
        </div>
    </div>

</body>
</html>
